#VRML_SIM R2025a utf8

PROTO Marker [
  field SFVec3f translation 0 0 0
  field SFColor color       1 1 0
]
{
  Pose {
    translation IS translation
    children [
      Pose {
        translation 0 0 1.5
        children [
          Shape {
            appearance Appearance {
              material Material { diffuseColor 0 0 0 emissiveColor IS color }
            }
            geometry Box { size 0.06 0.06 3 }
          }
        ]
      }
      Pose {
        translation 0 0 3.2
        children [
          Shape {
            appearance Appearance {
              material Material { diffuseColor 0 0 0 emissiveColor IS color }
            }
            geometry Sphere { radius 0.28 }
          }
        ]
      }
    ]
  }
}
